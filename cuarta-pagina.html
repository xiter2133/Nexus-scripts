<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Script Desbloqueado | Kratos Panel</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #07090e;
            background-image: radial-gradient(circle at 50% 10%, #1a103c 0%, #07090e 70%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .card {
            background: rgba(13, 17, 26, 0.9);
            backdrop-filter: blur(15px);
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            max-width: 650px;
            width: 100%;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        h2 { margin-top: 0; color: #22c55e; font-size: 26px; text-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        
        .script-box {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #38bdf8;
            max-height: 220px;
            overflow-y: auto;
            word-break: break-all;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        .btn-copy {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4);
            transition: transform 0.2s;
        }
        .btn-copy:hover { transform: scale(1.02); }

        /* Ajuste responsivo para celulares pequeños */
        @media (max-width: 480px) {
            body {
                padding: 15px 10px;
            }
            .card {
                padding: 20px 15px;
            }
            h2 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎉 ¡Script Desbloqueado con Éxito!</h2>
        <p id="script-title">Copia el código a continuación para usarlo en tu ejecutor:</p>
        
        <div class="script-box" id="script-content">
            Cargando script seleccionado...
        </div>

        <button class="btn-copy" onclick="copyScript()">
            📋 Copiar Script al Portapapeles
        </button>
    </div>

    <script>
        // Diccionario limpio listo para tus scripts reales:
        const scriptsDatabase = {
            "bf-1": 'loadstring(game:HttpGet("https://pastebin.com/raw/kR3NTW55"))()'
        };

        const urlParams = new URLSearchParams(window.location.search);
        const scriptId = urlParams.get('script');
        const scriptBox = document.getElementById('script-content');
        const scriptTitle = document.getElementById('script-title');

        if (scriptId && scriptsDatabase[scriptId]) {
            scriptBox.innerText = scriptsDatabase[scriptId];
            scriptTitle.innerText = `Script correspondiente al ID: ${scriptId}`;
        } else {
            scriptBox.innerText = 'loadstring(game:HttpGet("ERROR: No se encontró ningún script asociado o el enlace es inválido."))()';
            scriptTitle.style.color = "#ef4444";
        }

        function copyScript() {
            const scriptText = scriptBox.innerText;
            navigator.clipboard.writeText(scriptText).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.innerText = "✔ ¡Copiado al Portapapeles!";
                btn.style.background = "linear-gradient(135deg, #3b82f6, #1d4ed8)";
                setTimeout(() => {
                    btn.innerText = "📋 Copiar Script al Portapapeles";
                    btn.style.background = "linear-gradient(135deg, #22c55e, #16a34a)";
                }, 3000);
            }).catch(err => {
                alert("No se pudo copiar automáticamente. Selecciónalo manualmente.");
            });
        }
    </script>
</body>
</html>
